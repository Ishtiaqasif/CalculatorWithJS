<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="A fast, responsive calculator that works on any device.">
    <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#eef0f4" media="(prefers-color-scheme: light)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Calculator</title>

    <link rel="icon" href="./assets/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="./assets/favicon.png">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="preload" href="./assets/fonts/Cuprum/Cuprum-Regular.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="style.css">

    <!-- Apply the saved theme before first paint to avoid a flash. -->
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('calc:theme');
                if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
            } catch (e) { /* storage unavailable */ }
        })();
    </script>
    <script src="script.js" defer></script>
</head>

<body>
    <main class="app" id="app">
        <section class="calculator" aria-label="Calculator">
            <header class="toolbar">
                <button class="icon-btn" id="historyToggle" type="button" aria-label="Show history"
                    aria-controls="history" aria-expanded="false" title="History">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8v4l2.5 2.5"/><path d="M3.05 11a9 9 0 1 1 .5 4"/><path d="M3 4v5h5"/></svg>
                </button>
                <div class="toolbar-group">
                    <button class="icon-btn" id="soundToggle" type="button" aria-pressed="true" title="Toggle sound">
                        <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
                        <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>
                        <span class="visually-hidden">Sound</span>
                    </button>
                    <button class="icon-btn" id="themeToggle" type="button" aria-label="Switch theme" title="Switch theme">
                        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                    </button>
                </div>
            </header>

            <div class="display" id="display">
                <div class="previous" id="previous" aria-hidden="true"></div>
                <div class="expression" id="expression" role="textbox" aria-readonly="true"
                    aria-label="Expression" tabindex="0"><span class="placeholder">0</span></div>
                <div class="preview" id="preview" aria-hidden="true"></div>
                <div class="visually-hidden" id="live" aria-live="polite" aria-atomic="true"></div>
            </div>

            <div class="keypad" id="keypad">
                <button type="button" class="key key-fn key-clear" data-action="clear" aria-label="All clear">AC</button>
                <button type="button" class="key key-fn" data-action="paren" aria-label="Parentheses">( )</button>
                <button type="button" class="key key-fn" data-value="%" aria-label="Percent">%</button>
                <button type="button" class="key key-op" data-value="÷" aria-label="Divide">÷</button>

                <button type="button" class="key" data-value="7">7</button>
                <button type="button" class="key" data-value="8">8</button>
                <button type="button" class="key" data-value="9">9</button>
                <button type="button" class="key key-op" data-value="×" aria-label="Multiply">×</button>

                <button type="button" class="key" data-value="4">4</button>
                <button type="button" class="key" data-value="5">5</button>
                <button type="button" class="key" data-value="6">6</button>
                <button type="button" class="key key-op" data-value="−" aria-label="Subtract">−</button>

                <button type="button" class="key" data-value="1">1</button>
                <button type="button" class="key" data-value="2">2</button>
                <button type="button" class="key" data-value="3">3</button>
                <button type="button" class="key key-op" data-value="+" aria-label="Add">+</button>

                <button type="button" class="key key-fn" data-action="backspace" aria-label="Delete">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12z"/><path d="m17 9-6 6"/><path d="m11 9 6 6"/></svg>
                </button>
                <button type="button" class="key" data-value="0">0</button>
                <button type="button" class="key" data-value="." aria-label="Decimal point">.</button>
                <button type="button" class="key key-equals" data-action="equals" aria-label="Equals">=</button>
            </div>
        </section>

        <aside class="history" id="history" aria-label="History">
            <header class="history-header">
                <h2>History</h2>
                <div class="toolbar-group">
                    <button class="text-btn" id="historyClear" type="button">Clear</button>
                    <button class="icon-btn history-close" id="historyClose" type="button" aria-label="Close history">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
                    </button>
                </div>
            </header>
            <ol class="history-list" id="historyList"></ol>
            <p class="history-empty" id="historyEmpty">No calculations yet.</p>
        </aside>
        <div class="scrim" id="scrim" hidden></div>
    </main>
</body>

</html>
